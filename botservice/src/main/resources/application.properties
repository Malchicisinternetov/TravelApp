spring.application.name=botservice
spring.main.web-application-type=none
bot.enabled=${BOT_ENABLED:false}
bot.offset-file=${BOT_OFFSET_FILE:./bot-state/offset.txt}
bot.name=${TELEGRAM_BOT_NAME}
bot.token=${TELEGRAM_BOT_TOKEN:}
bot.service-secret=${BOT_SERVICE_SECRET:}
bot.users-url=${USER_SERVICE_URL:http://localhost:8082}
bot.trips-url=${TRIP_SERVICE_URL:http://localhost:8083}
bot.expenses-url=${EXPENSES_SERVICE_URL:http://localhost:8084}
