server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location / { try_files $uri $uri/ /index.html; }
    location /api/users/ { proxy_pass http://userservice:8082/; include /etc/nginx/proxy_params_travel; }
    location /api/trips/ { proxy_pass http://tripservice:8083/; include /etc/nginx/proxy_params_travel; }
    location /api/expenses/ { proxy_pass http://expensesservice:8084/; include /etc/nginx/proxy_params_travel; }
    location /api/weather/ { proxy_pass http://weatherservice:8085/; include /etc/nginx/proxy_params_travel; }
    location /api/currency/ { proxy_pass http://currencyservice:8086/; include /etc/nginx/proxy_params_travel; }
}
