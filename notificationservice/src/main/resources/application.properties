spring.application.name=NotificationService
spring.main.web-application-type=none
spring.datasource.url=${NOTIFICATIONS_POSTGRES_URL}
spring.datasource.username=${NOTIFICATIONS_POSTGRES_USERNAME}
spring.datasource.password=${NOTIFICATIONS_POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
notifications.enabled=${NOTIFICATIONS_ENABLED:true}
notifications.poll-interval-ms=${NOTIFICATIONS_POLL_INTERVAL_MS:60000}
notifications.secret=${NOTIFICATION_SERVICE_SECRET:}
notifications.bot-token=${TELEGRAM_BOT_TOKEN:}
notifications.telegram-api-url=${TELEGRAM_API_URL:https://api.telegram.org}

travel.redis.url=${REDIS_URL:redis://localhost:6379}
travel.redis.enabled=${REDIS_ENABLED:true}
travel.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
travel.kafka.enabled=${KAFKA_ENABLED:true}
travel.kafka.timeout-seconds=${KAFKA_TIMEOUT_SECONDS:30}
travel.kafka.security-protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
travel.kafka.sasl-mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
travel.kafka.sasl-jaas-config=${KAFKA_SASL_JAAS_CONFIG:}
travel.kafka.auto-create-topics=${KAFKA_AUTO_CREATE_TOPICS:true}
