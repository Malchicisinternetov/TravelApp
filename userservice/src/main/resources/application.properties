spring.application.name=UserService

spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8082

security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:travelapp}
security.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}
security.bot.secret=${BOT_SERVICE_SECRET:}
security.notifications.secret=${NOTIFICATION_SERVICE_SECRET:}

security.web-session.ttl-seconds=${WEB_SESSION_TTL_SECONDS:604800}
security.web-session.secure=${WEB_SESSION_SECURE:false}

travel.redis.url=${REDIS_URL:redis://localhost:6379}
travel.redis.enabled=${REDIS_ENABLED:true}
travel.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
travel.kafka.enabled=${KAFKA_ENABLED:true}
travel.kafka.timeout-seconds=${KAFKA_TIMEOUT_SECONDS:30}
travel.kafka.security-protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
travel.kafka.sasl-mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
travel.kafka.sasl-jaas-config=${KAFKA_SASL_JAAS_CONFIG:}
travel.messaging.request-topic=travel.rpc.users
travel.kafka.auto-create-topics=${KAFKA_AUTO_CREATE_TOPICS:true}
