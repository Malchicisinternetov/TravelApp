name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create temporary test environment
        uses: ./.github/actions/test-environment

      - name: Java unit tests (integration tag excluded)
        run: sh ./mvnw --batch-mode --no-transfer-progress -Pci test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Save Java test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: '*/target/surefire-reports/'
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove temporary test environment
        if: always()
        shell: bash
        run: |
          if [ -n "${CI_ENV_FILE:-}" ]; then
            rm -f -- "$CI_ENV_FILE"
          fi

  service-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - uses: ./.github/actions/test-environment
      - name: In-service integration tests (Spring, H2, local HTTP vendors)
        run: sh ./mvnw --batch-mode --no-transfer-progress -Pservice-integration test
      - name: Save integration test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: service-integration-reports
          path: '*/target/surefire-reports/'
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove temporary test environment
        if: always()
        run: |
          if [ -n "${CI_ENV_FILE:-}" ]; then
            rm -f -- "$CI_ENV_FILE"
          fi

  multiservice-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_FILE: compose.test.yaml
      COMPOSE_PROJECT_NAME: travelapp-ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_PARALLEL_LIMIT: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/test-environment
      - name: Prepare reports and validate test stack
        run: |
          mkdir -p tests/reports
          docker compose --env-file "$CI_ENV_FILE" config --quiet
      - name: Build test images
        run: docker compose --env-file "$CI_ENV_FILE" build
      - name: Run Python tests against real services
        run: docker compose --env-file "$CI_ENV_FILE" up --abort-on-container-exit --exit-code-from tests tests
      - name: Collect service logs
        if: always()
        run: |
          mkdir -p tests/reports
          docker compose --env-file "$CI_ENV_FILE" logs --no-color > tests/reports/compose.log 2>&1
      - name: Remove test containers and volumes
        if: always()
        run: docker compose --env-file "$CI_ENV_FILE" down --volumes --remove-orphans
      - name: Save Python reports and service logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: multiservice-integration-reports
          path: tests/reports/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove temporary test environment
        if: always()
        run: |
          if [ -n "${CI_ENV_FILE:-}" ]; then
            rm -f -- "$CI_ENV_FILE"
          fi
