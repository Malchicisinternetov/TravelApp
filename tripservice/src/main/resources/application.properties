spring.application.name=TripService
server.port=8083
spring.datasource.url=${TRIP_POSTGRES_URL}
spring.datasource.username=${TRIP_POSTGRES_USERNAME}
spring.datasource.password=${TRIP_POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:travelapp}
