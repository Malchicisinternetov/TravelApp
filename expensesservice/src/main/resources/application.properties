spring.application.name=expensesservice
server.port=8084
spring.datasource.url=${EXPENSES_POSTGRES_URL}
spring.datasource.username=${EXPENSES_POSTGRES_USERNAME}
spring.datasource.password=${EXPENSES_POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:travelapp}
services.trip.url=${TRIP_SERVICE_URL:http://localhost:8083}
