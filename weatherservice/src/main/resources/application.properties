spring.application.name=weatherservice
server.port=${WEATHER_SERVICE_PORT:8085}
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:travelapp}
weather.forecast-url=${WEATHER_FORECAST_URL:https://api.open-meteo.com}
weather.geocoding-url=${WEATHER_GEOCODING_URL:https://geocoding-api.open-meteo.com}
weather.api-key=${WEATHER_API_KEY:}

travel.redis.url=${REDIS_URL:redis://localhost:6379}
travel.redis.enabled=${REDIS_ENABLED:true}
